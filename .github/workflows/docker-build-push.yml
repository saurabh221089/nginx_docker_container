name: Build and Push Docker Image

on:
  push:
    branches:
      - nginx_arm64
  #workflow_dispatch: #To enable manual triggers
    paths-ignore:
      - 'webapp-deploy/deployment.yaml'
      - 'webapp-deploy/service.yaml'

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: saurabh221089
  IMAGE_NAME: nginx_alpine

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: nginx_arm64
          fetch-depth: 0

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG} \
            -t ${{ env.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:rpi .

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:rpi

      - name: Update deployment.yaml
        run: |
          FILE="webapp-deploy/deployment.yaml"
          sed -i "s|image: .*|image: ${{ env.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}|g" "$FILE"
          echo "Updated file:"
          cat "$FILE"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add webapp-deploy/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes detected"
            exit 0
          fi

          git commit -m "Update deployment image to ${IMAGE_TAG}"
          git push origin nginx_arm64

